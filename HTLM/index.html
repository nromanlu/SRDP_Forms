<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NR_works</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --fg: #f0ece4;
      --accent: #c8f04a;
      --muted: #3a3a3a;
      --border: #222;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'Space Mono', monospace;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.4;
    }

    .container {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 2.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      animation: fadeDown 0.8s ease both;
    }

    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .logo span { color: var(--accent); }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 3rem;
      animation: fadeUp 1s ease 0.2s both;
    }

    .heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .heading span { color: var(--accent); }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 420px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 1.6rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 0;
    }

    .btn:hover::before { transform: translateX(0); }

    .btn:hover {
      color: #0a0a0a;
      border-color: var(--accent);
    }

    .btn span, .btn-arrow { position: relative; z-index: 1; }

    .btn-arrow {
      font-size: 1rem;
      position: relative;
      z-index: 1;
      transition: transform 0.2s;
    }

    .btn:hover .btn-arrow { transform: translateX(4px); }

    footer {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      animation: fadeUp 1s ease 0.5s both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <div class="logo">NR<span>_</span>works</div>
    </header>

    <main>
      <h1 class="heading">Wähle einen<br/><span>Rapport</span>.</h1>

      <div class="buttons">
        <a href="Pikettrapport/pikettrapport.html" class="btn">
          <span>Pikettrapport</span>
          <span class="btn-arrow">→</span>
        </a>
        <a href="einsatzrapport.html" class="btn">
          <span>Einsatzrapport</span>
          <span class="btn-arrow">→</span>
        </a>
      </div>
    </main>

    <footer>
      <span>© 2026 NR_works</span>
      <span>Webpage · In Development</span>
    </footer>

  </div>
</body>
</html>
